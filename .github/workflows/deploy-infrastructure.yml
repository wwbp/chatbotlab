name: Deploy Infrastructure

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  READ THIS BEFORE RUNNING AGAINST THE WWBP ACCOUNT                      │
# │                                                                          │
# │  The live staging and production deployments were created MANUALLY,     │
# │  before this IaC existed. They are NOT in any Terraform state:          │
# │                                                                          │
# │    frontend  S3 "bot.wwbp.org" / "dev.bot.wwbp.org" + CloudFront        │
# │    backend   EB application "humanlikebot" (envs humanlikebot-env,      │
# │              humanlike-bot-development-env)                             │
# │    database  EB-managed RDS "awseb-e-*-stack-awsebrdsdatabase-*"        │
# │              — this holds REAL STUDY DATA                               │
# │                                                                          │
# │  Terraform builds a parallel stack named "<prefix>-<environment>-*",    │
# │  which does not overlap with any of the above. Running this workflow    │
# │  therefore does not manage or migrate the live deployment — it builds   │
# │  a SECOND one, and you pay for both.                                    │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Two jobs:
#
#   plan   Runs on every pull request that touches infra/terraform/**, once
#          for staging and once for production, after a reviewer approves it
#          in the plan-<environment> GitHub Environment. Read-only: it
#          assumes a role that cannot change AWS, takes no state lock, and is
#          given no real application secrets. It skips with a notice when the role is not
#          configured (and on pull requests from forks, which get no secrets).
#
#   apply  Runs only when a person starts the workflow by hand. It runs in the
#          GitHub Environment named by the `environment` input, so required
#          reviewers on that Environment must approve before anything starts.
#          `action` defaults to "plan": the run prints the real plan and stops.
#          Choose "apply" to print the plan and then apply exactly that plan.
#
# A failed apply leaves everything in place. Nothing here destroys or deletes.
#
# AWS access is by GitHub OIDC only (short-lived credentials, no stored keys).
# The account's GitHub OIDC provider is created once, by hand, and shared with
# the live deploys. Terraform only refers to it (create_github_oidc_provider =
# false); the roles here cannot change it.
#
# Settings
#   infra/terraform/environments/<environment>.tfvars
#       Non-secret settings: instance sizes, custom domain. In git, so a
#       change to them is reviewed and planned like any other change.
#
#   Repository secrets (Settings → Secrets and variables → Actions)
#     TF_PROJECT_PREFIX     Name prefix for every AWS resource (var.project_name).
#                           No default: a wrong value points Terraform at the
#                           wrong state.
#     GH_PAT                Token that can write repository secrets. Needed
#                           only when write_deploy_secrets is ticked.
#
#   Environment secret (Settings → Environments → plan-staging / plan-production)
#     TF_PLAN_ROLE_ARN      Read-only IAM role the plan job assumes for that
#                           environment.
#
#   Environment secrets (Settings → Environments → staging / production)
#     TF_APPLY_ROLE_ARN     IAM role the apply job assumes.
#     DB_PASSWORD           Database password (letters + numbers only).
#     ADMIN_PANEL_PASSWORD  Password of the `admin` user in the admin panel.
#     OPENAI_API_KEY        OpenAI key (or ANTHROPIC_API_KEY, or both).
#     ANTHROPIC_API_KEY
#     SURVEY_INGEST_TOKEN   Optional.
#   These may also be repository secrets, but then staging and production
#   share them and are not protected by the Environment's reviewers.

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:
    inputs:
      # No default on purpose: the person starting the run chooses. Each
      # environment has its own Terraform state, so a run only ever touches
      # the environment named here.
      environment:
        description: 'Which environment to build or update'
        required: true
        type: choice
        options:
          - staging
          - production
      # Plan unless told otherwise, so a run started without thought changes
      # nothing.
      action:
        description: 'plan = print what would change and stop; apply = print it, then do it'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      # Off unless asked. A plan that deletes or replaces any resource stops
      # the run before it applies.
      allow_destroy:
        description: 'With apply: allow a plan that deletes or replaces resources'
        required: false
        default: false
        type: boolean
      # Off unless asked. The deploy secrets decide where staging.yml and
      # production.yml send the application, so writing them is a cutover step,
      # not part of building infrastructure.
      write_deploy_secrets:
        description: "With apply: also point this environment's app deploy workflow at this stack (writes GitHub secrets)"
        required: false
        default: false
        type: boolean

# Nothing by default. Each job asks for what it needs: an OIDC token to sign
# in to AWS and read access to check out the code.
permissions: {}

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # plan — pull requests only, read-only
  # ════════════════════════════════════════════════════════════════════════════
  plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Runs only after a required reviewer approves it in the
    # plan-<environment> GitHub Environment: it runs the pull request's code
    # with a role that can read that environment's Terraform state (which
    # still holds secrets). Each plan role trusts only its own Environment.
    environment: plan-${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      ENVIRONMENT:                        ${{ matrix.environment }}
      TF_VAR_project_name:                ${{ secrets.TF_PROJECT_PREFIX }}
      TF_VAR_environment:                 ${{ matrix.environment }}
      TF_VAR_github_org:                  ${{ github.repository_owner }}
      TF_VAR_github_repo:                 ${{ github.event.repository.name }}
      TF_VAR_github_org_id:               ${{ github.repository_owner_id }}
      TF_VAR_github_repo_id:              ${{ github.repository_id }}
      TF_VAR_create_github_oidc_provider: false
      # This job runs the pull request's own code, so it is given no real
      # application secrets. The plan therefore always shows the database
      # password and the secret application settings as changed. Ignore those
      # lines; the plan printed by a manual run (action = plan) has the real
      # values.
      TF_VAR_db_password:                 placeholder-not-the-real-password
      TF_VAR_admin_panel_password:        placeholder-not-the-real-password

    steps:
      # Skip, do not fail, when the plan role is not set up yet. Pull requests
      # from forks land here too: GitHub gives them no secrets.
      - name: Check that the plan role is configured
        id: config
        env:
          TF_PLAN_ROLE_ARN:  ${{ secrets.TF_PLAN_ROLE_ARN }}
          TF_PROJECT_PREFIX: ${{ secrets.TF_PROJECT_PREFIX }}
        run: |
          if [[ -z "$TF_PLAN_ROLE_ARN" || -z "$TF_PROJECT_PREFIX" ]]; then
            echo "::notice::Terraform plan skipped: the TF_PLAN_ROLE_ARN (plan-<environment> Environment) and TF_PROJECT_PREFIX (repository) secrets are not both set (or this pull request comes from a fork). See infra/terraform/README.md, 'Running Terraform from GitHub Actions'."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Setup Terraform
        if: steps.config.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.11'
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only role, OIDC)
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      # An environment that was never built has no state to compare with.
      - name: Locate Terraform state
        id: state
        if: steps.config.outputs.configured == 'true'
        env:
          TF_PROJECT_PREFIX: ${{ secrets.TF_PROJECT_PREFIX }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_PROJECT_PREFIX}-tfstate-${ACCOUNT_ID}"
          # Any error here (no bucket, access denied) fails the job: a
          # skipped plan would hide what the pull request changes.
          aws s3api head-bucket --bucket "$BUCKET"
          if err=$(aws s3api head-object --bucket "$BUCKET" --key "${TF_PROJECT_PREFIX}/${ENVIRONMENT}/terraform.tfstate" 2>&1 >/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          elif grep -q "(404)" <<<"$err"; then
            echo "::notice::Terraform plan skipped for ${ENVIRONMENT}: no state file yet (the environment has not been built)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$err"
            echo "::error::Cannot read the ${ENVIRONMENT} state file. Check the plan role's permissions (bootstrap/iam/plan-permissions.json)."
            exit 1
          fi

      - name: Initialise Terraform
        if: steps.state.outputs.found == 'true'
        working-directory: infra/terraform
        env:
          TF_PROJECT_PREFIX: ${{ secrets.TF_PROJECT_PREFIX }}
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=${TF_PROJECT_PREFIX}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -input=false

      # -lock=false: this plan is never applied, and taking the lock would
      # mean giving a role that runs pull-request code write access to the
      # state bucket. The apply job plans again, under the lock.
      - name: Plan
        if: steps.state.outputs.found == 'true'
        working-directory: infra/terraform
        run: |
          set -o pipefail
          terraform plan -lock=false -input=false -no-color -var-file="environments/${ENVIRONMENT}.tfvars" | tee plan.txt
          {
            echo "## Terraform plan: ${ENVIRONMENT}"
            echo ""
            echo "\`$(grep -E '^(Plan:|No changes\.)' plan.txt | head -1)\`"
            echo ""
            echo "The full plan is in this job's log, step **Plan**."
            echo ""
            echo "The database password and the secret application settings always show as changed here: this job is given placeholders, not the real secrets."
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════════
  # apply — started by hand, approved through the GitHub Environment
  # ════════════════════════════════════════════════════════════════════════════
  apply:
    # A fixed name: on pull requests this job is skipped, and GitHub shows a
    # skipped job's name without filling in expressions.
    name: Plan or apply (manual run)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Required reviewers set on this Environment must approve the run before
    # it starts, and its secrets are available only to an approved run.
    environment: ${{ inputs.environment }}
    # One run per environment at a time; a second waits. The state lock would
    # stop it anyway, but as a failed run rather than a queued one.
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT:                        ${{ inputs.environment }}
      TF_VAR_project_name:                ${{ secrets.TF_PROJECT_PREFIX }}
      TF_VAR_environment:                 ${{ inputs.environment }}
      TF_VAR_github_org:                  ${{ github.repository_owner }}
      TF_VAR_github_repo:                 ${{ github.event.repository.name }}
      TF_VAR_github_org_id:               ${{ github.repository_owner_id }}
      TF_VAR_github_repo_id:              ${{ github.repository_id }}
      TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
      TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
      TF_VAR_survey_ingest_token:         ${{ secrets.SURVEY_INGEST_TOKEN }}
      TF_VAR_create_github_oidc_provider: false

    steps:
      # ── 1. Fail fast before touching AWS if anything is missing ───────────────
      - name: Check required secrets
        env:
          OPENAI_KEY:           ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          ADMIN_PANEL_PASSWORD: ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_APPLY_ROLE_ARN:    ${{ secrets.TF_APPLY_ROLE_ARN }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          TF_PROJECT_PREFIX:    ${{ secrets.TF_PROJECT_PREFIX }}
          OLD_DOMAIN_NAME:      ${{ secrets.DOMAIN_NAME }}
          ACTION:               ${{ inputs.action }}
          WRITE_DEPLOY_SECRETS: ${{ inputs.write_deploy_secrets }}
        run: |
          fail=0
          missing() { echo "::error::$1 secret is not set"; fail=1; }

          [[ -z "$TF_APPLY_ROLE_ARN" ]]    && missing "TF_APPLY_ROLE_ARN"
          [[ -z "$DB_PASSWORD" ]]          && missing "DB_PASSWORD"
          [[ -z "$ADMIN_PANEL_PASSWORD" ]] && missing "ADMIN_PANEL_PASSWORD"
          [[ -z "$TF_PROJECT_PREFIX" ]]    && missing "TF_PROJECT_PREFIX"

          if [[ -z "$OPENAI_KEY" && -z "$ANTHROPIC_KEY" ]]; then
            echo "::error::At least one of OPENAI_API_KEY or ANTHROPIC_API_KEY must be set"
            fail=1
          fi

          # The custom domain used to come from the DOMAIN_NAME secret. It is
          # now domain_name in environments/<environment>.tfvars. Carrying on
          # with the secret still set would plan to remove the domain from a
          # stack that has one.
          if [[ -n "$OLD_DOMAIN_NAME" ]]; then
            echo "::error::The DOMAIN_NAME secret is no longer read. Put the domain in infra/terraform/environments/${ENVIRONMENT}.tfvars (domain_name = \"…\"), merge that, then delete the DOMAIN_NAME secret."
            fail=1
          fi

          if [[ "$WRITE_DEPLOY_SECRETS" == "true" && "$ACTION" != "apply" ]]; then
            echo "::error::write_deploy_secrets needs action = apply."
            fail=1
          fi
          [[ "$WRITE_DEPLOY_SECRETS" == "true" && -z "$GH_PAT" ]] && missing "GH_PAT"

          if [[ $fail -eq 1 ]]; then exit 1; fi

          if [[ "$WRITE_DEPLOY_SECRETS" == "true" ]]; then
            # Validate GH_PAT has write access before touching AWS.
            # We do this by writing and immediately deleting a test secret.
            export GH_TOKEN="$GH_PAT"
            if ! gh secret set __PREFLIGHT_TEST__ --body "ok" --repo "${{ github.repository }}" 2>/dev/null; then
              echo "::error::GH_PAT cannot write repository secrets on ${{ github.repository }}."
              echo "::error::Classic token: tick the top-level 'repo' scope. 'public_repo' is NOT enough, even for a public repository."
              echo "::error::Fine-grained token: it must list ${{ github.repository }} under 'Only select repositories', with Repository permissions -> Secrets: Read and write."
              exit 1
            fi
            gh secret delete __PREFLIGHT_TEST__ --repo "${{ github.repository }}" 2>/dev/null || true

            # production.yml falls back to AWS_ACCOUNT_ID, AWS_ROLE_NAME and
            # AWS_BACKEND_APPLICATION_NAME until its own AWS_PROD_* secrets
            # exist. Writing the staging values while it still falls back
            # would repoint production deploys at the staging stack.
            if [[ "$ENVIRONMENT" == "staging" ]]; then
              existing=$(gh secret list --repo "${{ github.repository }}" --json name --jq '.[].name')
              for name in AWS_PROD_ACCOUNT_ID AWS_PROD_ROLE_NAME AWS_PROD_BACKEND_APPLICATION_NAME; do
                if ! grep -qx "$name" <<<"$existing"; then
                  echo "::error::$name is not set. Set the three AWS_PROD_* secrets (account, role, EB application) to the values production uses today before writing the staging secrets."
                  fail=1
                fi
              done
              if [[ $fail -eq 1 ]]; then exit 1; fi
            fi
          fi

          echo "All required secrets are present and valid."

      # ── 2. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 3. Terraform ──────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.11'
          terraform_wrapper: false

      # ── 4. AWS credentials (short-lived, GitHub OIDC) ─────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      # ── 5. Find the S3 state bucket; create it on a first apply ──────────────
      # Deterministic name: "<TF_PROJECT_PREFIX>-tfstate-<ACCOUNT_ID>" — no random
      # suffix. The prefix comes from a secret so the repository does not
      # publish the names of live AWS resources.
      - name: Bootstrap Terraform state backend
        id: bootstrap
        env:
          TF_PROJECT_PREFIX: ${{ secrets.TF_PROJECT_PREFIX }}
          ACTION: ${{ inputs.action }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_PROJECT_PREFIX}-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $BUCKET"
          elif [[ "$ACTION" != "apply" ]]; then
            echo "::error::The state bucket does not exist yet. A plan creates nothing; run with action = apply to build the first environment."
            exit 1
          else
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "State bucket created: $BUCKET"
          fi

          # State used to live at one key for the whole project, and that
          # stack was always "production". Starting again from an empty
          # per-environment state would try to build a second copy on top of
          # it, so stop until the old state file has been moved.
          # Listing needs only s3:ListBucket, and an error fails the step
          # instead of reading as "no old state".
          legacy=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "${TF_PROJECT_PREFIX}/terraform.tfstate" --query 'KeyCount' --output text)
          if [[ "$legacy" != "0" ]]; then
            echo "::error::Old state file found at s3://<state bucket>/<prefix>/terraform.tfstate. It describes a production stack. Move it to <prefix>/production/terraform.tfstate (aws s3 mv), then run this workflow again."
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "prefix=$TF_PROJECT_PREFIX" >> "$GITHUB_OUTPUT"

      # ── 6. Point Terraform at the remote state bucket ─────────────────────────
      # One state file per environment. The lock (use_lockfile) is set in the
      # backend block in main.tf, so it cannot be left off here.
      - name: Initialise Terraform
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=${{ steps.bootstrap.outputs.prefix }}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -input=false

      # ── 7. Custom domain: create the ACM cert first so we can print the     ───
      #       DNS validation record before the full apply waits for it          ───
      # This targeted apply runs before the plan below and is not part of it.
      # It touches only the certificate.
      - name: Read the custom domain from the environment's settings
        id: domain
        working-directory: infra/terraform
        run: |
          DOMAIN=$(sed -n 's/^[[:space:]]*domain_name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "environments/${ENVIRONMENT}.tfvars")
          echo "name=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Create ACM certificate
        if: inputs.action == 'apply' && steps.domain.outputs.name != ''
        working-directory: infra/terraform
        run: |
          terraform apply -target='aws_acm_certificate.custom_domain[0]' -auto-approve -input=false -var-file="environments/${ENVIRONMENT}.tfvars"

      # ── 8. Print the DNS validation record to the summary so it can be     ───
      #       added while the rest of the infrastructure is building            ───
      - name: Print DNS validation record
        if: inputs.action == 'apply' && steps.domain.outputs.name != ''
        working-directory: infra/terraform
        run: |
          CNAME_NAME=$(terraform output -raw acm_validation_cname_name)
          CNAME_VALUE=$(terraform output -raw acm_validation_cname_value)
          {
            echo "## Action required: add this DNS record now"
            echo ""
            echo "Add the following record at your domain registrar **while this workflow continues running**."
            echo "This proves you own the domain and enables HTTPS for your custom URL."
            echo ""
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| CNAME | \`$CNAME_NAME\` | \`$CNAME_VALUE\` |"
            echo ""
            echo "> The workflow will wait up to 30 minutes for DNS to propagate."
            echo "> If it times out before you add the record, just re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 9. Plan — always, under the state lock ────────────────────────────────
      - name: Plan
        working-directory: infra/terraform
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan -var-file="environments/${ENVIRONMENT}.tfvars" | tee plan.txt
          {
            echo "## Terraform plan: ${ENVIRONMENT}"
            echo ""
            echo "\`$(grep -E '^(Plan:|No changes\.)' plan.txt | head -1)\`"
            echo ""
            echo "The full plan is in this job's log, step **Plan**."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 10. Stop before applying a plan that deletes or replaces anything ────
      # A replacement (delete + create) of the database or a bucket loses its
      # data. Such a plan applies only when the person starting the run ticked
      # allow_destroy after reading it.
      - name: Check the plan for deletions
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          terraform show -json tfplan > tfplan.json
          deletes=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.change.actions | join("+")) \(.address)"' tfplan.json)
          if [[ -n "$deletes" ]]; then
            echo "This plan deletes or replaces:"
            echo "$deletes"
            if [[ "$ALLOW_DESTROY" != "true" ]]; then
              echo "::error::The plan deletes or replaces resources (listed above). Nothing was applied. If that is intended, run again with allow_destroy ticked."
              exit 1
            fi
            echo "::warning::allow_destroy is ticked: applying a plan that deletes or replaces resources."
          fi

      # ── 11. Apply exactly the plan printed above ──────────────────────────────
      - name: Apply infrastructure
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: |
          terraform apply -input=false tfplan

      # ── 11. Point one environment's app deploy workflow at this stack ─────────
      # Only when asked, and only the secrets of the environment that was
      # built: staging.yml reads the plain names, production.yml reads the
      # *PROD* names. The two lists share nothing, so building one environment
      # can never repoint the other's deploys.
      - name: Write deployment secrets
        if: inputs.action == 'apply' && inputs.write_deploy_secrets
        working-directory: infra/terraform
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REPO="${{ github.repository }}"
          set_secret() { gh secret set "$1" --body "$2" --repo "$REPO"; }
          out() { terraform output -raw "github_secret_$1"; }

          case "$ENVIRONMENT" in
            staging)
              set_secret AWS_ACCOUNT_ID                 "$(out AWS_ACCOUNT_ID)"
              set_secret AWS_ROLE_NAME                  "$(out AWS_ROLE_NAME)"
              set_secret AWS_S3_BUCKET_NAME_FRONTEND    "$(out AWS_S3_BUCKET_NAME_FRONTEND)"
              set_secret AWS_CLOUDFRONT_DISTRIBUTION_ID "$(out AWS_CLOUDFRONT_DISTRIBUTION_ID)"
              set_secret AWS_BACKEND_APPLICATION_NAME   "$(out AWS_BACKEND_APPLICATION_NAME)"
              set_secret AWS_BACKEND_ENVIRONMENT_NAME   "$(out AWS_BACKEND_ENVIRONMENT_NAME)"
              ;;
            production)
              set_secret AWS_PROD_ACCOUNT_ID                 "$(out AWS_ACCOUNT_ID)"
              set_secret AWS_PROD_ROLE_NAME                  "$(out AWS_ROLE_NAME)"
              set_secret AWS_S3_PROD_BUCKET_NAME_FRONTEND    "$(out AWS_S3_BUCKET_NAME_FRONTEND)"
              set_secret AWS_PROD_CLOUDFRONT_DISTRIBUTION_ID "$(out AWS_CLOUDFRONT_DISTRIBUTION_ID)"
              set_secret AWS_PROD_BACKEND_APPLICATION_NAME   "$(out AWS_BACKEND_APPLICATION_NAME)"
              set_secret AWS_PROD_BACKEND_ENVIRONMENT_NAME   "$(out AWS_BACKEND_ENVIRONMENT_NAME)"
              ;;
            *)
              echo "::error::Unknown environment '$ENVIRONMENT'"
              exit 1
              ;;
          esac
          # No API URL secret is written on purpose. CloudFront proxies /api/*
          # to the backend on the same host it serves the app from, so the
          # frontend uses a relative /api base and needs no build-time URL.
          # That also means a custom domain needs no frontend rebuild.

      # ── 12. Report a failure — and change nothing ─────────────────────────────
      # A failed apply leaves every resource it created in place and recorded
      # in state, so the next run continues from there. This step must never
      # destroy, delete or import anything: on a re-run against a stack that
      # holds study data, a "rollback" would delete that stack.
      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Run failed — nothing was destroyed"
            echo ""
            echo "Every resource created so far is still in AWS and is recorded in the Terraform state."
            echo "Read the failed step's log, fix the cause, and run this workflow again: Terraform continues from where it stopped."
            echo ""
            echo "If the next run stops with a state lock error and no other run is in progress, a cancelled run left its lock behind: remove it with \`terraform force-unlock <lock id>\` (the error prints the id)."
            echo ""
            echo "To remove the stack on purpose, use the **Destroy Infrastructure** workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 13. Summary ───────────────────────────────────────────────────────────
      - name: Write summary (plan only)
        if: inputs.action != 'apply'
        run: |
          {
            echo ""
            echo "**Plan only. Nothing was changed.** To make these changes, run this workflow again with action = apply."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write summary
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        env:
          DOMAIN: ${{ steps.domain.outputs.name }}
        run: |
          FRONTEND_URL=$(terraform output -raw frontend_url)

          {
            echo "## Deployment complete"
            echo ""
            echo "| | URL |"
            echo "|---|---|"
            echo "| Chatbot | $FRONTEND_URL |"
            echo "| Admin panel | $FRONTEND_URL/api/admin/ |"
            echo ""
            echo "Log in to the admin panel with username \`admin\` and the password you set as \`ADMIN_PANEL_PASSWORD\`."
            echo ""
            echo "**Next step:** deploy the application code. Infrastructure and application deploys are separate: this workflow does not start one."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$DOMAIN" ]]; then
            CF_DOMAIN=$(terraform output -raw cloudfront_domain_name)
            {
              echo ""
              echo "## Custom domain: final DNS record"
              echo ""
              echo "After adding the validation record above and re-running this workflow, add this record to serve your chatbot at **https://$DOMAIN**:"
              echo ""
              echo "| Type | Name | Value |"
              echo "|---|---|---|"
              echo "| CNAME | \`$DOMAIN\` | \`$CF_DOMAIN\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
