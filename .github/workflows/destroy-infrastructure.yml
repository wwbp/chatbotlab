name: Destroy Infrastructure

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  WARNING: THIS WORKFLOW PERMANENTLY DELETES ALL AWS INFRASTRUCTURE      │
# │  AND ALL CONVERSATION DATA. THIS CANNOT BE UNDONE.                      │
# │                                                                          │
# │  Export any data you need from the admin panel BEFORE running this.     │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Manual only. To destroy an environment you must:
#   1. type its name (staging or production) — there is no default;
#   2. type "destroy <that name>" and "destroy data";
#   3. for production, also tick allow_production;
#   4. be approved by the reviewers of the GitHub Environment of that name,
#      if it has any (production should).
# A wrong or mistyped value stops the run before it signs in to AWS.
#
# Secrets: the same ones the apply job of Deploy Infrastructure uses
# (TF_APPLY_ROLE_ARN, TF_PROJECT_PREFIX, DB_PASSWORD, ADMIN_PANEL_PASSWORD, …).
# AWS access is by GitHub OIDC; there are no stored AWS keys.

on:
  workflow_dispatch:
    inputs:
      # Typed, not chosen from a list, and with no default: a list would
      # preselect its first entry.
      environment:
        description: 'Environment to destroy: type "staging" or "production"'
        required: true
        type: string
      confirm_destroy:
        description: 'Type "destroy staging" or "destroy production" — it must name the same environment'
        required: true
        type: string
      confirm_data_loss:
        description: 'Type "destroy data" to confirm all conversation data will be permanently deleted'
        required: true
        type: string
      allow_production:
        description: 'Required to destroy production. Leave unticked for staging.'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # Checked in a job of its own, before the job that names a GitHub
  # Environment: GitHub creates an Environment for any name a job gives it,
  # and a newly created one has no reviewers.
  validate:
    name: Check what was typed
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmations
        env:
          ENVIRONMENT:      ${{ inputs.environment }}
          CONFIRM_DESTROY:  ${{ inputs.confirm_destroy }}
          CONFIRM_DATA:     ${{ inputs.confirm_data_loss }}
          ALLOW_PRODUCTION: ${{ inputs.allow_production }}
        run: |
          fail=0
          if [[ "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "production" ]]; then
            echo "::error::Environment must be exactly 'staging' or 'production'. Got: '$ENVIRONMENT'"
            fail=1
          fi
          if [[ "$CONFIRM_DESTROY" != "destroy $ENVIRONMENT" ]]; then
            echo "::error::The confirmation must be exactly 'destroy $ENVIRONMENT'. Got: '$CONFIRM_DESTROY'"
            fail=1
          fi
          if [[ "$CONFIRM_DATA" != "destroy data" ]]; then
            echo "::error::The data confirmation must be exactly 'destroy data'. Got: '$CONFIRM_DATA'"
            fail=1
          fi
          if [[ "$ENVIRONMENT" == "production" && "$ALLOW_PRODUCTION" != "true" ]]; then
            echo "::error::Refusing to destroy production: allow_production is not ticked."
            fail=1
          fi
          if [[ $fail -eq 1 ]]; then exit 1; fi
          echo "Confirmations accepted for '$ENVIRONMENT'."

  destroy:
    name: Destroy ${{ inputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    # Reviewers required by this Environment must approve before the job
    # starts. Same concurrency group as the apply job, so the two never overlap.
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 2. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 3. Terraform ──────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.11'
          terraform_wrapper: false

      # ── 4. AWS credentials (short-lived, GitHub OIDC) ─────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      # ── 5. Locate state bucket ────────────────────────────────────────────────
      - name: Locate Terraform state bucket
        id: state
        env:
          TF_PROJECT_PREFIX: ${{ secrets.TF_PROJECT_PREFIX }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Required, with no fallback. This workflow deletes infrastructure, so
          # a guessed prefix could target the wrong resources entirely.
          if [ -z "$TF_PROJECT_PREFIX" ]; then
            echo "::error::TF_PROJECT_PREFIX is not set. Add it under Settings → Secrets and variables → Actions. It must match var.project_name in infra/terraform."
            exit 1
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_PROJECT_PREFIX}-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "::error::State bucket $BUCKET not found — there may be no infrastructure to destroy."
            exit 1
          fi
          # Stop before anything is emptied if this environment has no state:
          # with nothing in state Terraform would destroy nothing, but the
          # bucket-emptying step below would still have deleted its files.
          if ! aws s3api head-object --bucket "$BUCKET" --key "${TF_PROJECT_PREFIX}/${ENVIRONMENT}/terraform.tfstate" >/dev/null; then
            echo "::error::No Terraform state for '$ENVIRONMENT' in the state bucket — nothing here was built by Terraform under that name."
            exit 1
          fi
          {
            echo "bucket=$BUCKET"
            echo "account_id=$ACCOUNT_ID"
            echo "prefix=$TF_PROJECT_PREFIX"
          } >> "$GITHUB_OUTPUT"

      # ── 6. Initialise Terraform ───────────────────────────────────────────────
      - name: Initialise Terraform
        working-directory: infra/terraform
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=${{ steps.state.outputs.prefix }}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -input=false

      # ── 7. Empty S3 buckets ───────────────────────────────────────────────────
      # Terraform cannot delete a non-empty S3 bucket, so both the frontend and
      # data buckets have to be emptied first.
      #
      # Buckets are discovered by listing S3, not by rebuilding their names.
      # The rebuilt names used to carry an -${ACCOUNT_ID} suffix that s3.tf
      # does not use, so head-bucket missed both buckets, the step reported
      # "does not exist — skipping" for each, and destroy then failed on
      # BucketNotEmpty having emptied nothing.
      #
      # Terraform's own outputs are not usable here either. A retried teardown
      # runs against a partly destroyed state, where `terraform output -raw`
      # prints "Warning: No outputs found" to stdout and still exits 0 — so
      # the warning text itself ends up used as the bucket name. Listing is
      # the only source that stays correct no matter what state is in.
      #
      # `aws s3 rm` is also not enough on its own: the frontend bucket has
      # versioning enabled, so deleting an object only writes a delete marker
      # and leaves every noncurrent version in place, which still blocks
      # DeleteBucket. Delete versions and delete markers explicitly, in pages,
      # until the listing comes back empty.
      - name: Empty S3 buckets
        env:
          PREFIX: ${{ steps.state.outputs.prefix }}
          ENVIRONMENT: ${{ inputs.environment }}
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
        run: |
          empty_bucket() {
            local b="$1" n
            if ! aws s3api head-bucket --bucket "$b" 2>/dev/null; then
              echo "Bucket $b does not exist — skipping."
              return 0
            fi
            echo "Emptying s3://$b ..."
            while :; do
              aws s3api list-object-versions --bucket "$b" --max-keys 500 --output json \
                | jq -c '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key, VersionId})), Quiet: true}' \
                > /tmp/delete.json
              n=$(jq '.Objects | length' /tmp/delete.json)
              [ "$n" -eq 0 ] && break
              aws s3api delete-objects --bucket "$b" --delete "file:///tmp/delete.json" >/dev/null
              echo "  removed $n object versions"
            done
            echo "  Done — s3://$b is empty."
          }

          # Everything this environment owns. The match includes the
          # environment: matching on the project prefix alone would also empty
          # the other environment's buckets. The state bucket is named
          # <prefix>-tfstate-…, so it does not match; the explicit check stays
          # as a second guard, because the destroy right after this reads it.
          for b in $(aws s3api list-buckets \
                       --query "Buckets[?starts_with(Name, '${PREFIX}-${ENVIRONMENT}-')].Name" \
                       --output text); do
            [ "$b" = "$STATE_BUCKET" ] && { echo "Keeping state bucket $b."; continue; }
            empty_bucket "$b"
          done

      # ── 8. Disable RDS deletion protection ───────────────────────────────────
      # rds.tf sets deletion_protection = false, but guard against any manual
      # change that may have enabled it — destroy would fail silently otherwise.
      - name: Disable RDS deletion protection
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          RDS_ID="${{ steps.state.outputs.prefix }}-${ENVIRONMENT}-database"
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_ID" \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null \
            || echo "not-found")
          if [[ "$STATUS" != "not-found" && -n "$STATUS" ]]; then
            echo "Disabling deletion protection on $RDS_ID ..."
            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_ID" \
              --no-deletion-protection \
              --apply-immediately 2>/dev/null || true
          else
            echo "RDS instance not found — skipping."
          fi

      # ── 9. Destroy all infrastructure ─────────────────────────────────────────
      - name: Destroy infrastructure
        working-directory: infra/terraform
        env:
          TF_VAR_project_name:                ${{ secrets.TF_PROJECT_PREFIX }}
          TF_VAR_environment:                 ${{ inputs.environment }}
          TF_VAR_github_org:                  ${{ github.repository_owner }}
          TF_VAR_github_repo:                 ${{ github.event.repository.name }}
          TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_VAR_create_github_oidc_provider: false
          ENVIRONMENT:                        ${{ inputs.environment }}
        run: |
          terraform destroy -auto-approve -input=false -var-file="environments/${ENVIRONMENT}.tfvars"

      # ── 10. Summary ───────────────────────────────────────────────────────────
      - name: Write summary
        if: success()
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
        run: |
          {
            echo "## Infrastructure destroyed"
            echo ""
            echo "All AWS resources have been deleted. AWS will stop billing for this deployment within the hour."
            echo ""
            echo "### What was deleted"
            echo "- Elastic Beanstalk application and environment (app servers)"
            echo "- RDS MariaDB database and all conversation data"
            echo "- ElastiCache Redis cache"
            echo "- CloudFront distribution"
            echo "- S3 frontend bucket and all React build files"
            echo "- S3 data bucket and all uploaded files (avatars, voice audio)"
            echo "- VPC, subnets, and security groups"
            echo "- IAM roles and GitHub OIDC provider"
            echo ""
            echo "### What was NOT deleted"
            echo "The Terraform state bucket (\`${{ steps.state.outputs.prefix }}-tfstate-${ACCOUNT_ID}\`) was left in place."
            echo "It holds one state file per environment and costs less than \$0.01/month. Do not delete it"
            echo "while the other environment exists."
            echo ""
            echo "To redeploy in the future, run the **Deploy Infrastructure** workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
