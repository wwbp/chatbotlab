name: Destroy Infrastructure

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  WARNING: THIS WORKFLOW PERMANENTLY DELETES ALL AWS INFRASTRUCTURE      │
# │  AND ALL CONVERSATION DATA. THIS CANNOT BE UNDONE.                      │
# │                                                                          │
# │  Export any data you need from the admin panel BEFORE running this.     │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Manual only.
#
# test (the on-demand stack in the lab's TEST account): type "test" and get
#   the run approved in the test GitHub Environment. Nothing else is asked,
#   and NOTHING IS BACKED UP: its data bucket and database are deleted for
#   good. It holds no study data.
#
# production: type "production", "destroy production" and "destroy data",
#   tick allow_production, run from main, and get the run approved in the
#   production GitHub Environment. Before deleting anything it backs up the
#   data bucket into the state bucket (verified by object count and total
#   size), and the database leaves a final snapshot; the summary names both.
#
# A wrong or mistyped value stops the run before it signs in to AWS.
#
# Secrets: the same ones the apply job of Deploy Infrastructure uses
# (TF_PROD_ACCOUNT_ID / TF_TEST_ACCOUNT_ID, TF_PROJECT_PREFIX, DB_PASSWORD,
# ADMIN_PANEL_PASSWORD, …).
# AWS access is by GitHub OIDC; there are no stored AWS keys.

on:
  workflow_dispatch:
    inputs:
      # Typed, not chosen from a list, and with no default: a list would
      # preselect its first entry.
      environment:
        description: 'Environment to destroy: type "test" or "production"'
        required: true
        type: string
      confirm_destroy:
        description: 'Production only: type "destroy production"'
        required: false
        type: string
      confirm_data_loss:
        description: 'Production only: type "destroy data" to confirm all conversation data will be permanently deleted'
        required: false
        type: string
      allow_production:
        description: 'Required to destroy production. Leave unticked for test.'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # Checked in a job of its own, before the job that names a GitHub
  # Environment: GitHub creates an Environment for any name a job gives it,
  # and a newly created one has no reviewers.
  validate:
    name: Check what was typed
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmations
        env:
          ENVIRONMENT:      ${{ inputs.environment }}
          CONFIRM_DESTROY:  ${{ inputs.confirm_destroy }}
          CONFIRM_DATA:     ${{ inputs.confirm_data_loss }}
          ALLOW_PRODUCTION: ${{ inputs.allow_production }}
        run: |
          fail=0
          if [[ "$ENVIRONMENT" != "test" && "$ENVIRONMENT" != "production" ]]; then
            echo "::error::Environment must be exactly 'test' or 'production'. Got: '$ENVIRONMENT'"
            fail=1
          fi
          # Production: every confirmation, and only from main.
          if [[ "$ENVIRONMENT" == "production" && "$CONFIRM_DESTROY" != "destroy production" ]]; then
            echo "::error::The confirmation must be exactly 'destroy production'. Got: '$CONFIRM_DESTROY'"
            fail=1
          fi
          if [[ "$ENVIRONMENT" == "production" && "$CONFIRM_DATA" != "destroy data" ]]; then
            echo "::error::The data confirmation must be exactly 'destroy data'. Got: '$CONFIRM_DATA'"
            fail=1
          fi
          if [[ "$ENVIRONMENT" == "production" && "$ALLOW_PRODUCTION" != "true" ]]; then
            echo "::error::Refusing to destroy production: allow_production is not ticked."
            fail=1
          fi
          if [[ "$ENVIRONMENT" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production is destroyed only from main; this run is on $GITHUB_REF."
            fail=1
          fi
          if [[ $fail -eq 1 ]]; then exit 1; fi
          if [[ "$ENVIRONMENT" == "test" ]]; then
            echo "::warning::Destroying the test stack. Its data bucket and database are NOT backed up."
          fi
          echo "Confirmations accepted for '$ENVIRONMENT'."

  destroy:
    name: Destroy ${{ inputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    # Reviewers required by this Environment must approve before the job
    # starts. Same concurrency group as the apply job, so the two never overlap.
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 2. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 3. Terraform ──────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.11'
          terraform_wrapper: false

      # ── 4. AWS credentials (short-lived, GitHub OIDC) ─────────────────────────
      # The same account choice as Deploy Infrastructure: production and test
      # live in different AWS accounts, and credentials from any other account
      # are refused.
      - name: Choose the AWS account
        id: aws
        env:
          ENVIRONMENT:        ${{ inputs.environment }}
          TF_PROD_ACCOUNT_ID: ${{ secrets.TF_PROD_ACCOUNT_ID }}
          TF_TEST_ACCOUNT_ID: ${{ secrets.TF_TEST_ACCOUNT_ID }}
          TF_PROJECT_PREFIX:  ${{ secrets.TF_PROJECT_PREFIX }}
        run: |
          case "$ENVIRONMENT" in
            production) ACCOUNT="$TF_PROD_ACCOUNT_ID" ;;
            test)       ACCOUNT="$TF_TEST_ACCOUNT_ID" ;;
            *)          echo "::error::Unknown environment '$ENVIRONMENT'"; exit 1 ;;
          esac
          if [[ ! "$ACCOUNT" =~ ^[0-9]{12}$ ]]; then
            echo "::error::The AWS account ID of $ENVIRONMENT is not set (repository secret TF_PROD_ACCOUNT_ID or TF_TEST_ACCOUNT_ID, 12 digits)."
            exit 1
          fi
          if [[ "$TF_PROD_ACCOUNT_ID" == "$TF_TEST_ACCOUNT_ID" ]]; then
            echo "::error::TF_TEST_ACCOUNT_ID equals TF_PROD_ACCOUNT_ID. The test stack must live in the lab's separate TEST account."
            exit 1
          fi
          {
            echo "account=$ACCOUNT"
            echo "role=arn:aws:iam::${ACCOUNT}:role/${TF_PROJECT_PREFIX}-terraform-apply-${ENVIRONMENT}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.aws.outputs.role }}
          aws-region: us-east-1
          allowed-account-ids: ${{ steps.aws.outputs.account }}

      # ── 5. Locate state bucket ────────────────────────────────────────────────
      - name: Locate Terraform state bucket
        id: state
        env:
          TF_PROJECT_PREFIX: ${{ secrets.TF_PROJECT_PREFIX }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Required, with no fallback. This workflow deletes infrastructure, so
          # a guessed prefix could target the wrong resources entirely.
          if [ -z "$TF_PROJECT_PREFIX" ]; then
            echo "::error::TF_PROJECT_PREFIX is not set. Add it under Settings → Secrets and variables → Actions. It must match var.project_name in infra/terraform."
            exit 1
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_PROJECT_PREFIX}-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "::error::State bucket $BUCKET not found — there may be no infrastructure to destroy."
            exit 1
          fi
          # Stop before anything is emptied if this environment has no state:
          # with nothing in state Terraform would destroy nothing, but the
          # bucket-emptying step below would still have deleted its files.
          if ! aws s3api head-object --bucket "$BUCKET" --key "${TF_PROJECT_PREFIX}/${ENVIRONMENT}/terraform.tfstate" >/dev/null; then
            echo "::error::No Terraform state for '$ENVIRONMENT' in the state bucket — nothing here was built by Terraform under that name."
            exit 1
          fi
          {
            echo "bucket=$BUCKET"
            echo "account_id=$ACCOUNT_ID"
            echo "prefix=$TF_PROJECT_PREFIX"
          } >> "$GITHUB_OUTPUT"

      # ── 6. Initialise Terraform ───────────────────────────────────────────────
      - name: Initialise Terraform
        working-directory: infra/terraform
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
          PREFIX: ${{ steps.state.outputs.prefix }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${PREFIX}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -input=false

      # Production keeps a final snapshot of the database (rds.tf); read its
      # name now, while the state still has it, so the summary can name it.
      - name: Read the RDS final snapshot name
        id: snapshot
        working-directory: infra/terraform
        run: |
          SNAPSHOT=$(terraform show -json | jq -r '[.values.root_module.resources[]? | select(.address == "aws_db_instance.main") | .values.final_snapshot_identifier // empty][0] // empty')
          echo "name=$SNAPSHOT" >> "$GITHUB_OUTPUT"

      # ── 7. Back up the data bucket (production only) ─────────────────────────
      # The test stack is not backed up: it holds no study data.
      # The data bucket holds participant uploads (avatars, voice audio).
      # Copy it into the state bucket, which this workflow never deletes,
      # under <prefix>/<environment>/backups/<UTC time>/data/, then compare
      # object count and total size. A mismatch stops the run before anything
      # is changed. Only current object versions are copied.
      - name: Back up the data bucket
        id: backup
        if: inputs.environment == 'production'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PREFIX: ${{ steps.state.outputs.prefix }}
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
        run: |
          DATA="${PREFIX}-${ENVIRONMENT}-data"
          if ! err=$(aws s3api head-bucket --bucket "$DATA" 2>&1); then
            if grep -q "(404)" <<<"$err"; then
              echo "No data bucket $DATA — nothing to back up."
              exit 0
            fi
            echo "$err"
            exit 1
          fi
          totals() {
            aws s3 ls --recursive "$1" \
              | awk '$4 !~ /^uploads\// {o++; s+=$3} END {print o+0 " objects, " s+0 " bytes"}'
          }
          src=$(totals "s3://$DATA")
          if [[ "$src" == "0 objects, 0 bytes" ]]; then
            echo "Data bucket $DATA is empty — nothing to back up."
            echo "summary=empty" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BACKUP="s3://${STATE_BUCKET}/${PREFIX}/${ENVIRONMENT}/backups/$(date -u +%Y%m%dT%H%M%SZ)/data"
          aws s3 sync "s3://$DATA" "$BACKUP/" --exclude 'uploads/*' --only-show-errors
          dst=$(totals "$BACKUP/")
          if [[ "$src" != "$dst" ]]; then
            echo "::error::The backup does not match the data bucket (source: $src; backup: $dst). Nothing was changed: deletion protection, buckets and resources are as they were."
            exit 1
          fi
          echo "Backed up $src to $BACKUP/"
          {
            echo "location=$BACKUP/"
            echo "summary=$src"
          } >> "$GITHUB_OUTPUT"

      # ── 8. Disable RDS deletion protection ───────────────────────────────────
      # Production sets deletion_protection = true (rds.tf), and someone may
      # have switched it on elsewhere. terraform destroy would then fail on
      # the database after the buckets had already been emptied, so turn it
      # off before emptying them (and only after the backup succeeded), wait
      # until the change is applied, and stop on any error other than "there
      # is no such database". If anything later fails, the step after the
      # destroy turns protection back on.
      - name: Disable RDS deletion protection
        id: rds
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PREFIX: ${{ steps.state.outputs.prefix }}
        run: |
          RDS_ID="${PREFIX}-${ENVIRONMENT}-database"
          if ! PROTECTED=$(aws rds describe-db-instances --db-instance-identifier "$RDS_ID" \
                 --query 'DBInstances[0].DeletionProtection' --output text 2>&1); then
            if grep -q "DBInstanceNotFound" <<<"$PROTECTED"; then
              echo "No database $RDS_ID — nothing to unprotect."
              exit 0
            fi
            echo "$PROTECTED"
            exit 1
          fi
          if [[ "$PROTECTED" == "True" ]]; then
            echo "Disabling deletion protection on $RDS_ID ..."
            aws rds modify-db-instance --db-instance-identifier "$RDS_ID" \
              --no-deletion-protection --apply-immediately >/dev/null
            # Recorded first, so a failure from here on turns it back on.
            echo "unprotected=true" >> "$GITHUB_OUTPUT"
          fi
          aws rds wait db-instance-available --db-instance-identifier "$RDS_ID"
          echo "$RDS_ID is available, deletion protection off."

      # ── 9. Empty S3 buckets ───────────────────────────────────────────────────
      # Terraform cannot delete a non-empty S3 bucket, so both the frontend and
      # data buckets have to be emptied first.
      #
      # Buckets are discovered by listing S3, not by rebuilding their names.
      # The rebuilt names used to carry an -${ACCOUNT_ID} suffix that s3.tf
      # does not use, so head-bucket missed both buckets, the step reported
      # "does not exist — skipping" for each, and destroy then failed on
      # BucketNotEmpty having emptied nothing.
      #
      # Terraform's own outputs are not usable here either. A retried teardown
      # runs against a partly destroyed state, where `terraform output -raw`
      # prints "Warning: No outputs found" to stdout and still exits 0 — so
      # the warning text itself ends up used as the bucket name. Listing is
      # the only source that stays correct no matter what state is in.
      #
      # `aws s3 rm` is also not enough on its own: the frontend bucket has
      # versioning enabled, so deleting an object only writes a delete marker
      # and leaves every noncurrent version in place, which still blocks
      # DeleteBucket. Delete versions and delete markers explicitly, in pages,
      # until the listing comes back empty.
      - name: Empty S3 buckets
        env:
          PREFIX: ${{ steps.state.outputs.prefix }}
          ENVIRONMENT: ${{ inputs.environment }}
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
        run: |
          empty_bucket() {
            local b="$1" n
            if ! aws s3api head-bucket --bucket "$b" 2>/dev/null; then
              echo "Bucket $b does not exist — skipping."
              return 0
            fi
            echo "Emptying s3://$b ..."
            while :; do
              aws s3api list-object-versions --bucket "$b" --max-keys 500 --output json \
                | jq -c '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key, VersionId})), Quiet: true}' \
                > /tmp/delete.json
              n=$(jq '.Objects | length' /tmp/delete.json)
              [ "$n" -eq 0 ] && break
              aws s3api delete-objects --bucket "$b" --delete "file:///tmp/delete.json" >/dev/null
              echo "  removed $n object versions"
            done
            echo "  Done — s3://$b is empty."
          }

          # Everything this environment owns. The match includes the
          # environment: matching on the project prefix alone would also empty
          # the other environment's buckets. The state bucket is named
          # <prefix>-tfstate-…, so it does not match; the explicit check stays
          # as a second guard, because the destroy right after this reads it.
          for b in $(aws s3api list-buckets \
                       --query "Buckets[?starts_with(Name, '${PREFIX}-${ENVIRONMENT}-')].Name" \
                       --output text); do
            [ "$b" = "$STATE_BUCKET" ] && { echo "Keeping state bucket $b."; continue; }
            empty_bucket "$b"
          done

      # ── 10. Destroy all infrastructure ─────────────────────────────────────────
      - name: Destroy infrastructure
        working-directory: infra/terraform
        env:
          TF_VAR_project_name:                ${{ secrets.TF_PROJECT_PREFIX }}
          TF_VAR_environment:                 ${{ inputs.environment }}
          TF_VAR_github_org:                  ${{ github.repository_owner }}
          TF_VAR_github_repo:                 ${{ github.event.repository.name }}
          TF_VAR_openai_api_key:              ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key:           ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_db_password:                 ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_panel_password:        ${{ secrets.ADMIN_PANEL_PASSWORD }}
          TF_VAR_create_github_oidc_provider: false
          ENVIRONMENT:                        ${{ inputs.environment }}
        run: |
          terraform destroy -auto-approve -input=false -var-file="environments/${ENVIRONMENT}.tfvars"

      # ── 11. Put deletion protection back if the run failed after removing it
      - name: Re-enable RDS deletion protection
        if: failure() && steps.rds.outputs.unprotected == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PREFIX: ${{ steps.state.outputs.prefix }}
        run: |
          RDS_ID="${PREFIX}-${ENVIRONMENT}-database"
          if aws rds modify-db-instance --db-instance-identifier "$RDS_ID" \
               --deletion-protection --apply-immediately >/dev/null; then
            msg="Deletion protection on $RDS_ID was turned back on."
          else
            msg="Could not turn deletion protection back on for $RDS_ID (the database may already be gone). Check it in the AWS console."
            echo "::error::$msg"
          fi
          {
            echo "## Destroy did not complete"
            echo ""
            echo "This run turned off RDS deletion protection and then failed. $msg"
            echo "The data bucket backup, if this run made one, is in the state bucket under <prefix>/${ENVIRONMENT}/backups/."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 12. Summary ───────────────────────────────────────────────────────────
      - name: Write summary
        if: success()
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          PREFIX: ${{ steps.state.outputs.prefix }}
          BACKUP: ${{ steps.backup.outputs.location }}
          BACKUP_SUMMARY: ${{ steps.backup.outputs.summary }}
          SNAPSHOT: ${{ steps.snapshot.outputs.name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "## Infrastructure destroyed"
            echo ""
            echo "All AWS resources have been deleted. AWS will stop billing for this deployment within the hour."
            echo ""
            echo "### Kept"
            if [[ "$ENVIRONMENT" == "test" ]]; then
              echo "- Data bucket backup: none. The test stack is destroyed without a backup: its files and database are gone for good."
            elif [[ -n "$BACKUP" ]]; then
              echo "- Data bucket backup ($BACKUP_SUMMARY, count and size verified): \`$BACKUP\`"
            else
              echo "- Data bucket backup: none (${BACKUP_SUMMARY:-no data bucket})"
            fi
            if [[ -n "$SNAPSHOT" ]]; then
              echo "- RDS final snapshot: \`$SNAPSHOT\` (restore it with \`aws rds restore-db-instance-from-db-snapshot\`)"
            else
              echo "- RDS final snapshot: none (the test stack is configured without one)"
            fi
            echo "- The Terraform state bucket \`${PREFIX}-tfstate-${ACCOUNT_ID}\`. It holds this account's state file and, for production, the backups above."
            echo "- The shared GitHub OIDC provider (kept: no Terraform stack owns it)."
            echo ""
            echo "### What was deleted"
            echo "- Elastic Beanstalk application and environment (app servers)"
            echo "- RDS MySQL database"
            echo "- ElastiCache Redis cache"
            echo "- CloudFront distribution"
            echo "- S3 frontend and data buckets"
            echo "- VPC, subnets, and security groups"
            echo "- IAM roles of this environment"
            echo ""
            echo "To redeploy in the future, run the **Deploy Infrastructure** workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
