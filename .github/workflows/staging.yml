name: Deploy Humanlike-Bot Client and Server to Staging

on:
  push:
    branches:
      - staging

permissions:
  id-token: write
  contents: read

jobs:
  # ── Run the full CI suite first ──────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  deploy_frontend:
    name: Deploy Frontend Humanlike-Bot Client to Staging
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      # The API URL is baked into the bundle at build time. Leaving the secret
      # unset is a valid configuration: CloudFront proxies /api/* to the
      # backend on the same host it serves the app from, so the frontend falls
      # back to a relative /api base. Set it only to point the frontend at an
      # API somewhere else.
      - name: Report which API base the bundle will use
        env:
          VITE_API_URL: ${{ secrets.VITE_STAGING_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_STAGING_API_URL is not set — building against the relative /api base (same origin as CloudFront)."
          else
            echo "Building against $VITE_API_URL"
          fi

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_STAGING_API_URL }}
        run: |
          cd web
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: Sync S3 bucket
        run: |
          aws s3 rm s3://${{ secrets.AWS_S3_BUCKET_NAME_FRONTEND }} --recursive
          aws s3 sync web/build/ s3://${{ secrets.AWS_S3_BUCKET_NAME_FRONTEND }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  deploy_backend:
    name: Deploy Backend Humanlike-Bot Server to Staging
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: Install AWS Elastic Beanstalk CLI
        run: |
          pip install awsebcli

      - name: Deploy Django to Elastic Beanstalk
        run: |
          cd api
          eb init -p docker ${{ secrets.AWS_BACKEND_APPLICATION_NAME }} --region us-east-1
          eb use ${{ secrets.AWS_BACKEND_ENVIRONMENT_NAME }}
          eb deploy --timeout 30

  # ── Check the deployed site actually works ───────────────────────────────────
  # `eb deploy` succeeding only means the new version was rolled out. This
  # fails the workflow if the API cannot reach its database or cache, or the
  # frontend is not being served. It reports a broken deploy; it does not roll
  # one back.
  smoke:
    name: Smoke test Staging
    runs-on: ubuntu-latest
    needs: [deploy_frontend, deploy_backend]
    env:
      # Other deployments of this repository: set the repository variable
      # STAGING_SITE_URL to your site's URL (e.g. https://xxxx.cloudfront.net).
      SITE_URL: ${{ vars.STAGING_SITE_URL || (github.repository == 'wwbp/chatbotlab' && 'https://dev.bot.wwbp.org') || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Smoke test the deployed site
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::STAGING_SITE_URL is not set — skipping the post-deploy smoke test."
            exit 0
          fi
          bash scripts/smoke.sh "$SITE_URL"
